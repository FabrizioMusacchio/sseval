[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scientific-software-evaluation"
version = "0.1.0"
description = "Exploratory analysis of published scientific software projects linked to GitHub repositories."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "matplotlib>=3.8",
  "pandas>=2.2",
  "python-dateutil>=2.9",
  "pyyaml>=6.0",
  "requests>=2.31",
  "seaborn>=0.13",
  "tqdm>=4.66",
]

[project.scripts]
sseval = "sseval.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sseval*"]
